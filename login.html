<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f8fafc;
            /* Matching premium subtle geometric background pattern */
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.05) 0px, transparent 50%),
                linear-gradient(to right, rgba(15, 23, 42, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Pure, Minimal Login Card */
        .login-card {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 48px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06),
                        0 0 0 1px rgba(15, 23, 42, 0.02);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.4s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            border-color: rgba(15, 23, 42, 0.15);
            box-shadow: 0 30px 60px -15px rgba(15, 23, 42, 0.1),
                        0 0 0 1px rgba(15, 23, 42, 0.04);
        }

        /* Form Layout & Elements */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            font-size: 0.925rem;
            font-weight: 500;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            background-color: #ffffff;
            border-color: #0f172a;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.06);
        }

        /* Premium Action Button */
        .submit-btn {
            width: 100%;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 0.925rem;
            font-weight: 600;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 0.01em;
            margin-top: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #1e293b;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Sign Up Utility Link styling */
        .form-footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-footer a {
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
            position: relative;
            transition: color 0.2s ease;
        }

        .form-footer a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1.5px;
            bottom: -2px;
            left: 0;
            background-color: #0f172a;
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }

        .form-footer a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <form action="/login" method="POST">
            
            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Sign In</button>
            
        </form>

        <!-- Link back to index.html -->
		<p class="form-footer">
		    Don't have an account?&nbsp;<a href="index.html">Sign up</a>
		</p>
    </div>

</body>
</html>
